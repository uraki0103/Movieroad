services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      RAILS_ENV: development
      CLOUDINARY_URL: "${CLOUDINARY_URL}"
      TMDB_API_KEY: "${TMDB_API_KEY}"
    depends_on:
      - db
    tty: true
    stdin_open: true

  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
    - "5432:5432"

  tailwind:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: tailwindcss --input=app/assets/tailwind/application.css --output=app/assets/builds/tailwind.css --watch=always
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      RAILS_ENV: development
    depends_on:
      - db

volumes:
  postgres_data:
  bundle_cache:

